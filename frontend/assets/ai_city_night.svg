<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a52"/>
      <stop offset="1" stop-color="#3a2a5e"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="520" cy="80" r="34" fill="url(#moon)"/>
  <circle cx="520" cy="80" r="34" fill="none" stroke="#ffe9b0" stroke-opacity="0.4" stroke-width="8"/>
  <!-- 远处楼群（AI 生成风格：轮廓过度平滑，缺乏真实结构） -->
  <g fill="#232c55">
    <rect x="20" y="150" width="70" height="250"/>
    <rect x="100" y="120" width="60" height="280"/>
    <rect x="170" y="170" width="80" height="230"/>
    <rect x="260" y="100" width="65" height="300"/>
    <rect x="335" y="140" width="75" height="260"/>
    <rect x="420" y="110" width="70" height="290"/>
    <rect x="500" y="160" width="80" height="240"/>
    <rect x="585" y="130" width="55" height="270"/>
  </g>
  <!-- 窗户：包含“悬空/越界”的 AI 典型破绽（第三栋楼右下角窗户超出楼体下缘） -->
  <g fill="#ffd27a" fill-opacity="0.85">
    <g id="winA">
      <rect x="30" y="170" width="14" height="18"/>
      <rect x="58" y="170" width="14" height="18"/>
      <rect x="30" y="205" width="14" height="18"/>
      <rect x="58" y="205" width="14" height="18"/>
    </g>
    <use href="#winA" x="68" y="-40"/>
    <use href="#winA" x="150" y="10"/>
    <use href="#winA" x="272" y="-60"/>
    <use href="#winA" x="347" y="-20"/>
    <use href="#winA" x="432" y="-50"/>
    <use href="#winA" x="512" y="0"/>
    <use href="#winA" x="595" y="-30"/>
    <!-- 破绽 1：楼体下缘之外悬空的一扇窗 -->
    <rect x="150" y="415" width="14" height="18" fill="#ffd27a" fill-opacity="0.9"/>
  </g>
  <!-- 街道 -->
  <rect y="360" width="640" height="40" fill="#141a38"/>
  <!-- 路灯：破绽 2 —— 光源方向与月亮矛盾（灯影向右，月亮在右） -->
  <g stroke="#f5e9c8" stroke-width="3">
    <line x1="180" y1="360" x2="180" y2="300"/>
    <line x1="380" y1="360" x2="380" y2="300"/>
    <line x1="540" y1="360" x2="540" y2="300"/>
  </g>
  <g fill="#fff6d8" fill-opacity="0.9">
    <ellipse cx="180" cy="295" rx="10" ry="6"/>
    <ellipse cx="380" cy="295" rx="10" ry="6"/>
    <ellipse cx="540" cy="295" rx="10" ry="6"/>
  </g>
  <!-- 灯光投影：应向左（与月亮同侧），这里故意向右，形成物理矛盾 -->
  <g fill="#fff6d8" fill-opacity="0.25">
    <path d="M186 360 L240 390 L186 390 Z"/>
    <path d="M386 360 L440 390 L386 390 Z"/>
    <path d="M546 360 L600 390 L546 390 Z"/>
  </g>
  <!-- 破绽 3：悬浮在半空的一团光斑（无光源） -->
  <circle cx="250" cy="230" r="8" fill="#fff6d8" fill-opacity="0.55"/>
  <text x="320" y="24" fill="#c9d4ff" font-size="13" font-family="sans-serif" text-anchor="middle">AI 生成风格夜景示例：请观察结构、光影与细节异常</text>
</svg>
