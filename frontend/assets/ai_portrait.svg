  <g stroke="#f2c9a8" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M186 440 Q150 470 128 500"/>
  </g>
  <!-- 左手（破绽 3：六根手指） -->
  <g stroke="#f2c9a8" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M128 500 L104 492"/>
    <path d="M128 500 L100 502"/>
    <path d="M128 500 L104 514"/>
    <path d="M128 500 L114 528"/>
    <path d="M128 500 L128 534"/>
    <path d="M128 500 L140 530"/>
  </g>
  <text x="240" y="40" fill="#6b5d92" font-size="14" font-family="sans-serif" text-anchor="middle">AI 生成风格人物示例：请寻找手部、对称性与背景纹理破绽</text>
</svg>
